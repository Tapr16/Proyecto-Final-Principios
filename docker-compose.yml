# Fase 1 — Despliegue con Docker Compose (en nodo1).
# Límites iguales a los de Kubernetes: API 1 CPU / 512 MB, PostgreSQL 1 CPU / 2 GB.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tienda
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en el archivo .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d tienda"]
      interval: 5s
      retries: 10
    cpus: "1.0"
    mem_limit: 2g

  api:
    image: ${API_IMAGE:-ghcr.io/tapr16/pf-api:1.0}
    build: ./app
    environment:
      DATABASE_URL: postgresql+asyncpg://app:${DB_PASSWORD}@db:5432/tienda
      DB_POOL_SIZE: "10"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    cpus: "1.0"
    mem_limit: 512m

volumes:
  pgdata:
