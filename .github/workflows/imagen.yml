# Construye y publica la imagen de la API en GHCR: ghcr.io/tapr16/pf-api:1.0
# Se ejecuta a mano (pestaña Actions -> "Publicar imagen" -> Run workflow) o al cambiar app/.
# Durante el experimento la imagen no debe cambiar: no modificar app/ mientras se mide.
name: Publicar imagen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**"]

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ghcr.io/tapr16/pf-api:1.0
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
