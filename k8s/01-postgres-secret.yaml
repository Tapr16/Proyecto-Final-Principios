# Cambiar CAMBIAR-CLAVE (en las dos líneas) antes de aplicar.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: proyecto
type: Opaque
stringData:
  POSTGRES_DB: tienda
  POSTGRES_USER: app
  POSTGRES_PASSWORD: CAMBIAR-CLAVE
  DATABASE_URL: postgresql+asyncpg://app:CAMBIAR-CLAVE@postgres:5432/tienda
